[package]
name = "pg-studio"
version = "0.1.0"
description = "A CLI tool to introspect a remote Postgres database via SSH tunnel and launch Drizzle Studio"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.3", features = ["derive"] }
ctrlc = "3.5.2"
directories = "6.0.0"
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
which = "8.0.5"
