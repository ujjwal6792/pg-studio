[package]
name = "pg-studio"
version = "0.2.1"
description = "A CLI tool to introspect a remote Postgres database via SSH tunnel and launch Drizzle Studio"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.3", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
directories = "6.0.0"
keyring = "4.1.5"
ratatui = "0.30.2"
regex = "1.13.1"
self_update = { version = "0.44.0", features = [
  "rustls",
  "archive-tar",
  "compression-flate2",
] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
tui-input = "0.15.3"
which = "8.0.5"
